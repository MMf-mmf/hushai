[package]
name = "hushai-backend"
version = "0.1.0"
edition = "2024"
description = "Hushai data-intake backend: durable, idempotent segment-ingest server (contract v0.1.0)"

[dependencies]
# HTTP server
axum = { version = "0.8", features = ["multipart", "macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "timeout", "limit"] }

# Native rustls TLS termination (shared by all three services via `src/tls.rs`).
# `tls-rustls-no-provider` so WE install the aws-lc-rs crypto provider explicitly
# (it's already vendored via sqlx `tls-rustls`) instead of axum-server pulling a
# second/duplicate `ring` provider — which would panic at the first handshake.
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
# Direct handle to rustls so `tls.rs` can install the aws-lc-rs provider exactly once.
rustls = "0.23"

# Database (Postgres + pgvector). sqlx 0.9 lets pgvector::Vector bind via the binary
# protocol (its sqlx trait impls target 0.9); see hushai-worker/src/process.rs.
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "json",
    "macros",
    "migrate",
] }
pgvector = { version = "0.4.2", features = ["sqlx"] }

# Proto / wire
prost = "0.14"

# Identity, hashing, encoding
uuid = { version = "1", features = ["v7", "serde"] }
sha2 = "0.10"
hex = "0.4"
# Constant-time bearer-token comparison (no early-exit timing oracle on the secret).
subtle = "2"

# Serde / json
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Observability
tracing = "0.1"
# `json` powers the production (machine-parseable) log format toggled by LOG_FORMAT=json.
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
# Non-blocking, daily-rotated on-disk log files (the durable audit trail), enabled by LOG_DIR.
tracing-appender = "0.2"

# Errors
thiserror = "2"
anyhow = "1"

# Config / filesystem
dotenvy = "0.15"
tempfile = "3"
fs2 = "0.4"

[build-dependencies]
prost-build = "0.14"

[dev-dependencies]
reqwest = { version = "0.12", features = ["multipart", "json"] }
prost = "0.14"
sha2 = "0.10"
uuid = { version = "1", features = ["v7"] }
