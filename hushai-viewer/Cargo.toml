[package]
name = "hushai-viewer"
version = "0.1.0"
edition = "2024"
description = "Hushai timeline viewer: a read-only browser NVR that stitches stored ~2s segments into one scrubbable HLS timeline (per-segment ffmpeg remux to MPEG-TS, served to hls.js)."

[dependencies]
# Reuse the ingest backend's Config + DB pool + storage helpers (path dep), exactly
# like hushai-worker / hushai-rag. The viewer is strictly read-only against DB + blobs.
hushai-backend = { path = "../hushai-backend" }

# HTTP server + static file serving (the bundled UI).
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["trace", "fs"] }

# Database. Runtime (unchecked) queries — dynamic time-window filters, no compile-time
# `.sqlx/` metadata needed (the worker/rag pattern).
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
] }

# Reverse-proxy `/v1/*` to hushai-rag (one origin, no CORS, server-side bearer).
# `stream` so the chat SSE response body is forwarded unbuffered.
reqwest = { version = "0.12", features = ["json", "stream"] }

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
# Logging is initialised centrally by `hushai_backend::logging` (subscriber + JSON/file + panic hook);
# this crate only emits via `tracing` macros, so it needs no direct `tracing-subscriber` dep.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
dotenvy = "0.15"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"

# Admin access control: IP allowlist (CIDR) + a signed session-cookie password gate.
ipnet = "2"                  # parse + match admin IP/CIDR allowlist
hmac = "0.12"                # HMAC-SHA256 session-cookie signing (constant-time verify)
sha2 = "0.10"                # paired with hmac 0.12
base64 = "0.22"             # url-safe encode of the cookie HMAC tag
rand = "0.9"                 # random session secret when VIEWER_SESSION_SECRET is unset
argon2 = "0.5"               # verify/derive the admin password hash (at-rest credential)
