<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hushai · Sign in</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%232ee6d6'/%3E%3C/svg%3E"
    />
    <!-- /styles.css is served pre-auth (public route in routes.rs) so the sign-in
         page shares the app's design system; see the "Login (pre-auth)" section. -->
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="auth-body">
    <form class="auth-card" method="POST" action="/login" autocomplete="off">
      <div class="brand"><span class="logo">◉</span> HUSHAI</div>
      <div class="auth-sub">Admin sign-in</div>
      <div id="err" class="auth-error">Incorrect password. Try again.</div>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autofocus required />
      <button type="submit" class="auth-submit">Sign in</button>
    </form>
    <script>
      // The server redirects to /login?error=1 on a bad password.
      if (new URLSearchParams(location.search).has("error")) {
        document.getElementById("err").style.display = "block";
      }
    </script>
  </body>
</html>
