<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hushai · Sign in</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%232ee6d6'/%3E%3C/svg%3E"
    />
    <!-- Self-contained: served pre-auth, so it can't pull /styles.css (that's gated). -->
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #0e1116;
        color: #e6edf3;
      }
      .card {
        width: min(22rem, 92vw);
        padding: 2rem 1.75rem;
        background: #161b22;
        border: 1px solid #232b36;
        border-radius: 14px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        margin-bottom: 0.25rem;
      }
      .logo { color: #2ee6d6; font-size: 1.2rem; }
      .sub { color: #8b949e; font-size: 0.85rem; margin-bottom: 1.4rem; }
      label { display: block; font-size: 0.8rem; color: #8b949e; margin-bottom: 0.4rem; }
      input[type="password"] {
        width: 100%;
        padding: 0.65rem 0.7rem;
        font-size: 1rem;
        color: #e6edf3;
        background: #0e1116;
        border: 1px solid #2d3540;
        border-radius: 8px;
        outline: none;
      }
      input[type="password"]:focus { border-color: #2ee6d6; }
      button {
        width: 100%;
        margin-top: 1rem;
        padding: 0.65rem 1rem;
        font-size: 1rem;
        font-weight: 600;
        color: #06231f;
        background: #2ee6d6;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      button:hover { background: #57f0e3; }
      .error {
        margin: 0 0 1rem;
        padding: 0.6rem 0.7rem;
        font-size: 0.85rem;
        color: #ffb4b4;
        background: rgba(255, 80, 80, 0.1);
        border: 1px solid rgba(255, 80, 80, 0.35);
        border-radius: 8px;
        display: none;
      }
    </style>
  </head>
  <body>
    <form class="card" method="POST" action="/login" autocomplete="off">
      <div class="brand"><span class="logo">◉</span> HUSHAI</div>
      <div class="sub">Admin sign-in</div>
      <div id="err" class="error">Incorrect password. Try again.</div>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autofocus required />
      <button type="submit">Sign in</button>
    </form>
    <script>
      // The server redirects to /login?error=1 on a bad password.
      if (new URLSearchParams(location.search).has("error")) {
        document.getElementById("err").style.display = "block";
      }
    </script>
  </body>
</html>
