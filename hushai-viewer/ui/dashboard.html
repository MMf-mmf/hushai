<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hushai · System</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%232ee6d6'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="dash-body">
    <!-- Rendered by js/nav.js initTopbar() — the shared brand/navlinks/live-chip/logout bar. -->
    <header class="topbar" data-topbar></header>

    <main class="dash">
      <div id="dashBanner" class="dash-banner loading">Loading system status…</div>

      <!-- At-a-glance KPI tiles (populated by dashboard.js). -->
      <div id="kpis" class="kpi-row"></div>

      <section class="dash-section">
        <div class="dash-head">
          <h2>Cameras</h2>
          <span id="cameraCount" class="count-chip"></span>
        </div>
        <div id="cameras" class="card-grid"></div>
      </section>

      <section class="dash-section">
        <div class="dash-head">
          <h2>Services &amp; dependencies</h2>
          <span id="serviceCount" class="count-chip"></span>
        </div>
        <div id="services" class="status-table"></div>
      </section>

      <section class="dash-section">
        <div class="dash-head"><h2>Work queues</h2></div>
        <div id="queues" class="queue-grid"></div>
      </section>

      <!-- Audit trail (roadmap C6): who did what, when, from where, with what outcome. Read-only
           view over the append-only /v1/audit log. Loaded on init + Apply/⟳ only — deliberately
           NOT on the 6s poll (an audit page that rewrites itself under the reader is useless).
           Datalists/target-type options are populated by dashboard.js from the loaded rows. -->
      <section class="dash-section">
        <div class="dash-head">
          <h2>Audit trail</h2>
          <span id="auditCount" class="count-chip"></span>
          <button id="auditRefresh" class="ghost" type="button" title="Refresh the audit trail"
            aria-label="Refresh the audit trail">⟳</button>
        </div>
        <div class="filters">
          <label>Actor
            <input id="aActor" type="text" list="aActorList" placeholder="any actor" size="14" />
          </label>
          <datalist id="aActorList"></datalist>
          <label>Action
            <input id="aAction" type="text" list="aActionList" placeholder="any action" size="18" />
          </label>
          <datalist id="aActionList"></datalist>
          <label>Target type
            <select id="aTargetType"><option value="">Any target</option></select>
          </label>
          <label>Since
            <input id="aSince" type="date" />
          </label>
          <button id="aApply" class="ghost" type="button">Apply</button>
        </div>
        <div id="audit" class="status-table"></div>
        <!-- Limit ladder 100→250→500→1000 (backend clamps at 1000); hidden when the server
             returned fewer rows than requested (i.e. we already have everything). -->
        <button id="auditMore" class="ghost audit-more" type="button" hidden>Load more</button>
      </section>

      <!-- Capacity / load test (hidden unless hushai-loadtest is publishing live.json). -->
      <section id="loadtestSection" class="dash-section" hidden>
        <div class="dash-head">
          <h2>Load test</h2>
          <span id="loadtestStatus" class="count-chip"></span>
        </div>
        <div id="loadtestSummary" class="muted small"></div>
        <canvas id="loadtestChart" class="lt-chart" width="900" height="320"></canvas>
      </section>
    </main>

    <script type="module" src="/js/dashboard/dashboard.js"></script>
  </body>
</html>
